<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="130" viewBox="0 0 1000 130" role="img" aria-label="About Me"><title>About Me</title><style>
.fly{animation:fly linear infinite}
@keyframes fly{0%{transform:translate(0,0);opacity:0}10%,85%{opacity:1}100%{transform:translate(var(--dx),var(--dy));opacity:0}}
.flap{animation:flap .6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes flap{from{transform:scale(1,1)}to{transform:scale(.94,.7)}}
.rain{animation:rain .6s linear infinite}
@keyframes rain{to{transform:translate(-40px,var(--h))}}
.drift{animation:drift 90s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-90px)}to{transform:translateX(90px)}}
.win{animation:win 11s steps(1) infinite}
@keyframes win{0%,70%{opacity:.4}71%,100%{opacity:0}}
.beacon{animation:beacon 2.6s ease-in-out infinite}
@keyframes beacon{0%,100%{opacity:.05}50%{opacity:.7}}
.flash{animation:flash 13s infinite;opacity:0}
@keyframes flash{0%,88%,100%{opacity:0}88.6%{opacity:.13}89.2%{opacity:.02}90%{opacity:.09}91.5%{opacity:0}}
.sway{animation:sway 14s ease-in-out infinite;transform-box:view-box}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.breathe{animation:breathe 5s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:.9}}
.shine{animation:shine 7s ease-in-out infinite}
@keyframes shine{0%,60%{transform:translateX(-200px)}90%,100%{transform:translateX(1200px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values=".33 .33 .33 0 0 .33 .33 .33 0 0 .33 .33 .33 0 0 0 0 0 0 .09"/></filter><filter id="pn" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.02 0.06" numOctaves="3" seed="5"/><feColorMatrix values="0 0 0 0 0.173 0 0 0 0 0.176 0 0 0 0 0.220 1.2 0 0 0 -0.35"/><feComposite in2="SourceGraphic" operator="in"/></filter><linearGradient id="lineL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4A4F5E" stop-opacity="0"/><stop offset="1" stop-color="#7B8193" stop-opacity="0.9"/></linearGradient><linearGradient id="lineR" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7B8193" stop-opacity="0.9"/><stop offset="1" stop-color="#4A4F5E" stop-opacity="0"/></linearGradient><linearGradient id="plateg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#171A23" stop-opacity="1"/><stop offset="1" stop-color="#0B0D13" stop-opacity="1"/></linearGradient><linearGradient id="shineg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.06"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><filter id="tg" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><clipPath id="pc"><path d="M351.3,34 H648.7 L662.7,48 V82 L648.7,96 H351.3 L337.3,82 V48Z"/></clipPath></defs><rect x="80" y="64.25" width="187.3" height="1.5" fill="url(#lineL)"/><rect x="732.7" y="64.25" width="187.3" height="1.5" fill="url(#lineR)"/><g transform="translate(301.3,65) scale(0.16)"><g fill="#7B8193"><path d="M0,-8 L5,-8 L9,-22 L13,-8 Q30,-10 46,-22 Q70,-34 100,-18 Q86,-8 84,6 Q72,-2 60,10 Q52,2 40,14 Q30,8 22,26 Q12,18 0,30Z"/><path transform="scale(-1,1)" d="M